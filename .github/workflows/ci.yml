name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4"]
        laravel: ["11.*", "12.*", "13.*"]
        exclude:
          - php: "8.2"
            laravel: "12.*"
          - php: "8.2"
            laravel: "13.*"
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Require Laravel version
        run: composer require "illuminate/contracts=${{ matrix.laravel }}" --no-update

      # Laravel 11 is EOL: every 11.x release carries an advisory, which makes Composer refuse
      # to resolve it. CI-only override so the 11.* constraint stays tested.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --no-security-blocking

      - name: Run tests
        run: vendor/bin/pest
